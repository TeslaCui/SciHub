<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f5ef" />
    <title>SciHub · 科研记录工作台</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <div><strong>SciHub</strong><small>本地科研记录工作台</small></div>
        </div>

        <div class="workspace-switcher"><span class="workspace-dot"></span><span>本地 Markdown 工作区</span></div>

        <nav class="nav-list">
          <button class="nav-item active" data-view="logs"><span>◒</span>实验日志</button>
          <button class="nav-item" data-view="records"><span>◌</span>对话记录</button>
          <button class="nav-item" data-view="memory"><span>≡</span>项目记忆</button>
        </nav>

        <div class="side-section">
          <div class="side-section-heading"><span>研究项目</span><button id="addProjectButton" title="新建项目">+</button></div>
          <div id="projectList" class="project-list"></div>
        </div>

        <div class="sidebar-bottom">
          <div class="privacy-note"><span>⌾</span><span><b>本地优先</b><small>记录保存到项目文件夹</small></span></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <button class="menu-button" id="menuButton" aria-label="打开导航">☰</button>
          <div class="topbar-title"><strong>科研记录</strong><span>实验日志、对话与项目记忆</span></div>
          <div class="topbar-actions"><button class="secondary-button" id="apiSettingsButton" title="配置 AI 接口">AI 设置</button><button class="primary-button" id="topNewProjectButton"><span>+</span> 新建项目</button></div>
        </header>

        <section id="logsView" class="view active-view">
          <div class="page-heading compact"><div><p class="eyebrow">实验日志</p><h1 id="logsProjectTitle">选择一个研究项目</h1><p>每天的记录保存为 <b>实验日志/日期.md</b>，并实时更新项目 AGENTS.md。</p></div><button class="secondary-button" id="viewAgentsButton">查看 AGENTS.md</button></div>
          <div id="logsBody"></div>
        </section>

        <section id="recordsView" class="view">
          <div class="page-heading compact"><div><p class="eyebrow">对话记录</p><h1 id="recordsProjectTitle">选择一个研究项目</h1><p>导入或继续 AI 对话；所有消息保存到项目的 <b>对话记录/</b> 文件夹。</p></div><div style="display:flex;gap:8px"><button class="secondary-button" id="recordImportButton">导入对话</button><button class="primary-button" id="newRecordButton"><span>+</span> 新建对话</button></div></div>
          <div id="recordsBody"></div>
        </section>

        <section id="memoryView" class="view">
          <div class="page-heading compact"><div><p class="eyebrow">项目记忆</p><h1 id="memoryProjectTitle">选择一个研究项目</h1><p>项目说明与重要信息会写入 README.md 和 AGENTS.md。</p></div></div>
          <div id="memoryBody"></div>
        </section>
      </main>
    </div>

    <div id="modalRoot"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
    <script src="records.js"></script>
  </body>
</html>
