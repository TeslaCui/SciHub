<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SciHub · 科研工作台</title>
<meta name="description" content="科研工作台：记录实验日志、文献笔记、表征数据与结果分析。">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json?v=0.23.0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ESci%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=0.23.0">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">Sci</span>
    <span class="brand-text"><b>SciHub</b><small>科研工作台</small></span>
  </div>

  <button type="button" class="tool-btn" id="tools-btn" title="小工具">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    <span>小工具</span>
  </button>

  <div class="user" id="user-box" hidden>
    <button type="button" class="user-btn" id="user-menu-btn" aria-haspopup="menu" aria-expanded="false">
      <span class="avatar" id="user-avatar">S</span>
      <span class="user-name" id="user-name"></span>
      <svg class="caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>

    <div class="user-menu" id="user-menu" role="menu" hidden>
      <div class="um-head">
        <div class="um-name" id="um-name"></div>
        <div class="um-sub" id="um-sub"></div>
      </div>
      <button type="button" role="menuitem" data-um="account">账号信息</button>
      <button type="button" role="menuitem" data-um="password">修改密码</button>
      <button type="button" role="menuitem" data-um="logout" class="um-danger">退出登录</button>
    </div>
  </div>
</header>

<p id="status" class="status" hidden></p>

<main>
  <!-- ── 未登录：登录 / 注册 ─────────────────────────────── -->
  <section id="auth-view" class="card auth">
    <h1 id="auth-title">登录</h1>

    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-mode="login">登录</button>
      <button type="button" class="tab" data-mode="register">注册</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <label><span id="auth-identifier-label">账号</span>
        <input id="auth-identifier" type="text" required autocomplete="username" placeholder="邮箱 / 用户名 / 电话">
      </label>

      <div id="register-extra" hidden>
        <label>用户名
          <input id="auth-username" type="text" maxlength="40" autocomplete="off" placeholder="用户名">
        </label>
        <label>电话
          <input id="auth-phone" type="tel" maxlength="30" autocomplete="off" placeholder="手机号">
        </label>
      </div>

      <label>密码
        <span class="pw-field">
          <input id="auth-password" type="password" required autocomplete="current-password" placeholder="密码">
          <button type="button" class="pw-toggle" data-target="auth-password" aria-label="显示密码" title="显示密码">
            <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
              <circle cx="12" cy="12" r="2.8"/>
            </svg>
            <svg class="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
              <circle cx="12" cy="12" r="2.8"/>
              <line x1="3.6" y1="3.6" x2="20.4" y2="20.4"/>
            </svg>
          </button>
        </span>
      </label>

      <div id="confirm-extra" hidden>
        <label>确认密码
          <span class="pw-field">
            <input id="auth-password2" type="password" autocomplete="new-password" placeholder="再次输入密码">
            <button type="button" class="pw-toggle" data-target="auth-password2" aria-label="显示密码" title="显示密码">
              <svg class="ico-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
                <circle cx="12" cy="12" r="2.8"/>
              </svg>
              <svg class="ico-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/>
                <circle cx="12" cy="12" r="2.8"/>
                <line x1="3.6" y1="3.6" x2="20.4" y2="20.4"/>
              </svg>
            </button>
          </span>
        </label>
      </div>

      <button id="auth-submit" type="submit" class="primary">登录</button>
    </form>
  </section>

  <!-- ── 已登录：主页 / 实验 / 记录 ─────────────────────── -->
  <section id="app-view" hidden>
    <nav class="nav" id="main-nav">
      <button type="button" class="nav-btn active" data-route="home">主页</button>
      <button type="button" class="nav-btn" data-route="plans">实验方案</button>
      <button type="button" class="nav-btn" data-route="records">科研记录</button>
    </nav>

    <div id="view-home" class="view"></div>
    <div id="view-plans" class="view" hidden></div>
    <div id="view-plan" class="view" hidden></div>
    <div id="view-run" class="view" hidden></div>

    <div id="view-records" class="view" hidden>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索标题 / 内容 / 标签">
        <select id="category-filter">
          <option value="">全部类别</option>
        </select>
        <button type="button" id="new-btn" class="primary">＋ 新建记录</button>
      </div>

      <form id="record-form" class="card" hidden>
        <h2 id="form-title">新建科研记录</h2>
        <label>标题
          <input id="f-title" required maxlength="200" placeholder="例如：Pt/Fe-N-C 样品 3 的 LSV 测试">
        </label>
        <div class="row">
          <label>类别
            <select id="f-category"></select>
          </label>
          <label>日期
            <input id="f-date" type="date">
          </label>
        </div>
        <label>标签（英文逗号分隔）
          <input id="f-tags" placeholder="ORR, LSV, 表征">
        </label>
        <label>内容
          <textarea id="f-content" rows="7" placeholder="记录条件、现象、结论、不确定性与未闭环问题…"></textarea>
        </label>
        <div class="actions">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="cancel-btn" class="ghost">取消</button>
        </div>
      </form>

      <div class="list-head">共 <b id="list-count">0</b> 条记录</div>
      <div id="records" class="records"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <span>© 2026 SciHub</span>
  <span class="ver" id="app-version" title="当前页面运行的前端版本">v—</span>
  <button type="button" class="ver-update" id="update-btn" hidden>有新版本，点击更新</button>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div class="actions" id="modal-actions"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js?v=0.23.0"></script>
<script src="experiment.js?v=0.23.0"></script>
</body>
</html>
